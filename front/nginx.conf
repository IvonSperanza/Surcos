# Escucha en 3000 porque es el puerto que Traefik espera del servicio web en
# el one-box de Thorque.
server {
    listen 3000;
    root /usr/share/nginx/html;

    # Los archivos de Vite llevan hash en el nombre: se pueden cachear para siempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: /p/SUR-…, /productor/… y el resto las resuelve react-router.
    location / {
        try_files $uri /index.html;
    }
}
